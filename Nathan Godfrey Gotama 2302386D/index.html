<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="DVE - Mouse - Anim.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" auto-rotate camera-orbit="174.1deg 63.48deg 2.248m" field-of-view="30deg" id="gear">

    <!--These are hotspot buttons-->
      <button class="Hotspot" slot="hotspot-2" data-position="0.008023392119802566m 0.25467448116459257m 0.2048909471233942m" data-normal="-3.469446951953614e-18m 0.7536051390988789m 0.6573273874742779m" data-visibility-attribute="visible"
      onMouseOver="addhotspot1()" onMouseOut="removehotspot1()">
          <div class="HotspotAnnotation" id="hotspot1" style="visibility:hidden">Scroll Wheel
          </div>
      </button>
      
      <button class="Hotspot" slot="hotspot-3" data-position="0.004146838200338836m 0.005005811214447051m -0.13845871784646485m" data-normal="-7.703719777548943e-34m -1m -2.2204460492503128e-16m" data-visibility-attribute="visible"
      onMouseOver="addhotspot2()" onMouseOut="removehotspot2()">
          <div class="HotspotAnnotation" id="hotspot2" style="visibility:hidden">Optical LED Sensor</div>
      </button>
      
      <button class="Hotspot" slot="hotspot-4" data-position="0.00814915402046332m 0.005005811214446861m -0.30482798720253873m" data-normal="0m -1m -2.220446049250313e-16m" data-visibility-attribute="visible"
      onMouseOver="addhotspot3()" onMouseOut="removehotspot3()">
          <div class="HotspotAnnotation" id="hotspot3" style="visibility:hidden">Power Switch</div>
      </button>
      
      <button class="Hotspot" slot="hotspot-5" data-position="0.15350054905240545m 0.18649467881743298m 0.23270926298080186m" data-normal="0.26312898399675777m 0.8963207416963955m 0.3568925129302342m" data-visibility-attribute="visible"
      onMouseOver="addhotspot4()" onMouseOut="removehotspot4()">
          <div class="HotspotAnnotation" id="hotspot4" style="visibility:hidden">Left Mouse Button</div>
      </button>
      
      <button class="Hotspot" slot="hotspot-6" data-position="-0.1298777143148917m 0.198961354049647m 0.2089623132036852m" data-normal="-0.2488715928699398m 0.903390904324215m 0.3492102579344657m" data-visibility-attribute="visible"
      onMouseOver="addhotspot5()" onMouseOut="removehotspot5()">
          <div class="HotspotAnnotation" id="hotspot5" style="visibility:hidden">Right Mouse Button</div>
      </button>

      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>

<div class="controls" style="position: absolute; bottom: 0px; left: 50px">
	<div>WM116 Mouse Variants: 
     	<button onClick="VBtn01()">01</button>
      	<button onClick="VBtn02()">02</button>
      	<button onClick="VBtn03()">03</button>
    	</div>
  </div>

<!--This piece of code is for position buttons-->
<div style="position:absolute; bottom:0px; right:50px">Views:
  <button onClick="setOrbit('90deg 0deg 1m')">Top</button>
  <button onClick="setOrbit('0deg 90deg 1m')">Front</button>
  <button onClick="setOrbit('90deg 90deg 1m')">Side</button>
  <button onClick="setOrbit('90deg 180deg 1m')">Bottom</button>
</div>

<!--This script is for animations-->
<div class="controls" style="position: absolute; Top: 20px; left: 20px">
	<div>Animations: 
<button onClick="Btn01()">Explode Model</button>
<button onClick="pauseAnimation()">Pause Animation</button>
<button onClick="playAnimation()">Resume Animation</button>
</div>
  </div>

    </model-viewer>  

    <!--This piece of code is also for position buttons-->
<script>
function setOrbit(orbit) {
  document.getElementById('gear').cameraOrbit = orbit;
}
</script>

<!--This piece of code is for hotspots-->
<script>
		  function addhotspot1(){
			document.getElementById("hotspot1").style.visibility="visible"
		  }
		  function removehotspot1(){
			document.getElementById("hotspot1").style.visibility="hidden";
		  }
		  
		  function addhotspot2(){
			document.getElementById("hotspot2").style.visibility="visible"
		  }
		  function removehotspot2(){
			document.getElementById("hotspot2").style.visibility="hidden";
		  }

      function addhotspot3(){
			document.getElementById("hotspot3").style.visibility="visible"
		  }
		  function removehotspot3(){
			document.getElementById("hotspot3").style.visibility="hidden";
		  }

      function addhotspot4(){
			document.getElementById("hotspot4").style.visibility="visible"
		  }
		  function removehotspot4(){
			document.getElementById("hotspot4").style.visibility="hidden";
		  }

      function addhotspot5(){
			document.getElementById("hotspot5").style.visibility="visible"
		  }
		  function removehotspot5(){
			document.getElementById("hotspot5").style.visibility="hidden";
		  }
</script>

<script>
	// script for button to change Model-Viewer Variants
	// function name() is to call the html element with ID call 'gear' and change the variantName to specfic variant name created in Blender.
	function VBtn01() {
		document.getElementById('gear').variantName = "Default";
	}
	function VBtn02() {
		document.getElementById('gear').variantName = "Aluminium";
	}
	function VBtn03() {
		document.getElementById('gear').variantName = "Glass";
	}
</script>

<!--This script is also for animations-->
<script>
function Btn01() {
document.getElementById('gear').pause();
document.getElementById('gear').animationName='Explode';
document.getElementById('gear').play({pingpong: true});
}
function pauseAnimation() {
document.getElementById('gear').pause();
}
function playAnimation() {
document.getElementById('gear').play();
}
</script>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>

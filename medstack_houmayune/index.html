<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Medical Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="lock-screen">
  <div class="container">
    <div class="icon">🔒</div>

    <h1>Enter PIN to access medical data</h1>
    <p class="subtitle">
      This PIN protects sensitive medical information from unauthorized access.
    </p>

    <div id="pin-dots" class="pin-dots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad">
      <button onclick="pressKey(1)">1</button>
      <button onclick="pressKey(2)">2</button>
      <button onclick="pressKey(3)">3</button>
      <button onclick="pressKey(4)">4</button>
      <button onclick="pressKey(5)">5</button>
      <button onclick="pressKey(6)">6</button>
      <button onclick="pressKey(7)">7</button>
      <button onclick="pressKey(8)">8</button>
      <button onclick="pressKey(9)">9</button>
      <button onclick="clearPin()">⌫</button>
      <button onclick="pressKey(0)">0</button>
      <button onclick="submitPin()">→</button>
    </div>

    <p class="demo-hint">Demo PIN: 123456</p>
  </div>

  <script src="app.js"></script>
</body>
</html>

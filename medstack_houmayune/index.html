<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Data Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(180deg, #0891b2 0%, #3b82f6 100%);
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            overflow: hidden;
        }

        .numpad-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: white;
            color: #3b82f6;
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }

        .numpad-btn:active {
            transform: scale(0.95);
            background-color: #f0f7ff;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            transition: background-color 0.2s;
        }

        .dot.filled {
            background-color: white;
        }

        #submit-btn {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div style="margin-top: 2rem; margin-bottom: 1.5rem;">
        <i class="fas fa-lock" style="font-size: 3rem;"></i>
    </div>

    <div style="max-width: 320px; width: 100%;">
        <h1 style="font-size: 1.8rem; font-weight: 700; line-height: 1.2; margin-bottom: 1rem;">
            Enter PIN to access medical data
        </h1>
        <p style="font-size: 0.9rem; opacity: 0.9; margin-bottom: 2rem;">
            This PIN is required to view sensitive patient history and medication details.
        </p>
    </div>

    <div id="pin-display" style="display: flex; gap: 15px; margin-bottom: 2.5rem;">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
